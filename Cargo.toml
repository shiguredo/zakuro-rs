[package]
name = "zakuro"
version = "2026.0.0"
edition = "2024"
rust-version = "1.96"
description = "Recording Composition Tool Zakuro"
readme = "README.md"
homepage = "https://github.com/shiguredo/zakuro-rs"
repository = "https://github.com/shiguredo/zakuro-rs"
license = "Apache-2.0"
publish = false

[[bin]]
name = "zakuro"
path = "src/main.rs"

[dependencies]
# 暗号ライブラリ (乱数生成に利用)
aws-lc-rs = "1.17"
# DuckDB バインディング (統計記録に利用)
# bundled は CI でビルド時間 30 分以上かかるため使用しない
# 代わりに DUCKDB_DOWNLOAD_LIB=1 で prebuilt バイナリをダウンロードする
duckdb = { version = "1.10504", default-features = false }
# UTC タイムスタンプ整形 (DuckDB ファイル名生成用)
jiff = "0.2"
# CLI 引数パース
noargs = "0.4"
# JSON パース / 生成
nojson = "0.3"
# 2D ベクターグラフィックス (フェイク映像生成)
raden = "2026.2.0-canary.0"
# HTTP/1.1 サーバー
shiguredo_http11 = "2026.6"
# OpenH264 バインディング (H.264 エンコード)
shiguredo_openh264 = "2026.1"
# クロスプラットフォーム ビデオデバイス
shiguredo_video_device = "2026.1"
# libwebrtc バインディング
shiguredo_webrtc = "0.150"
# Sora Rust SDK
sora_sdk = "2026.1.0-canary.11"
# 非同期ランタイム
tokio = {
  version = "1.52",
  features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
  ]
}
# tokio ユーティリティ (CancellationToken, DelayQueue)
tokio-util = { version = "0.7", features = ["time"] }
# tokio Stream ラッパー (ReceiverStream, IntervalStream)
tokio-stream = "0.1"

[dev-dependencies]
# テストで一時ディレクトリを使う
tempfile = "3.10"
