# zakuro (Sora 版) / zakuro-moq (MOQ 版) / zakuro-core (共有基盤) のワークスペース。
# バイナリはそれぞれのディレクトリで生成する (zakuro/target ではなく ./target に集約される)。
[workspace]
resolver = "3"
members = ["zakuro", "zakuro-core", "zakuro-moq"]

# 3 クレートで共有するメタデータ。バージョンはリリース時にここだけを更新する
[workspace.package]
version = "2026.0.0"
edition = "2024"
rust-version = "1.98"
homepage = "https://github.com/shiguredo/zakuro-rs"
repository = "https://github.com/shiguredo/zakuro-rs"
license = "Apache-2.0"

[profile.release]
strip = true
# 配布バイナリのサイズを抑える。libwebrtc の prebuilt macOS ライブラリが参照する
# ___isPlatformVersionAtLeast を fat LTO が落としてリンクに失敗するため、LTO は使わない
codegen-units = 1
