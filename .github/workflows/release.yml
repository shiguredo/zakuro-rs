name: release

on:
  push:
    tags:
      - "*"

# トップレベルで最小権限を宣言する (ci.yml と同じ書き方)
permissions:
  contents: write
  actions: read

jobs:
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get the version
        id: get_version
        run: echo "version=${GITHUB_REF/refs\/tags\//}" >> "$GITHUB_OUTPUT"
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          if [[ "$VERSION" == *canary* ]]; then
            gh release create "$VERSION" \
              --prerelease \
              --title "$VERSION" \
              --notes "Release $VERSION"
          else
            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes "Release $VERSION"
          fi

  build:
    name: Build (${{ matrix.platform }}-${{ matrix.arch }})
    needs: [github-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            platform: ubuntu-24.04
            arch: aarch64
          - os: ubuntu-26.04
            platform: ubuntu-26.04
            arch: x86_64
          - os: ubuntu-26.04-arm
            platform: ubuntu-26.04
            arch: aarch64
          - os: macos-15
            platform: macos-15
            arch: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Linux は AAC デコード (feature `fdk-aac`) を有効にしたバイナリを配布するため、
      # libfdk-aac-dev (ビルド時のヘッダー) と libclang-dev (bindgen) を導入する。
      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpulse-dev libx11-dev libfdk-aac-dev libclang-dev
      - run: rustup update stable
      - uses: shiguredo/github-actions/.github/actions/rust-cache@main
        with:
          os: ${{ matrix.os }}
          toolchain: stable
      - name: Build
        run: cargo build --release --locked --features fdk-aac
      - name: Package
        env:
          VERSION: ${{ needs.github-release.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          NAME="zakuro-${VERSION}-${PLATFORM}-${ARCH}"
          mkdir -p "dist/${NAME}"
          cp target/release/zakuro "dist/${NAME}/"
          # DuckDB の共有ライブラリは実行ファイルと同じディレクトリへ同梱する
          # (build.rs が埋め込む @executable_path / $ORIGIN で解決される)
          LIBDUCKDB=$(find target \( -name 'libduckdb.dylib' -o -name 'libduckdb.so' \) -print -quit)
          if [ -z "$LIBDUCKDB" ]; then
            echo "libduckdb not found" >&2
            exit 1
          fi
          cp "$LIBDUCKDB" "dist/${NAME}/"
          cp LICENSE THIRD_PARTY_LICENSES.md "dist/${NAME}/"
          tar -C dist -czf "${NAME}.tar.gz" "${NAME}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          else
            shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          fi
          tar -tzf "${NAME}.tar.gz"
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.github-release.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          NAME="zakuro-${VERSION}-${PLATFORM}-${ARCH}"
          gh release upload "${VERSION}" "${NAME}.tar.gz" "${NAME}.tar.gz.sha256" --clobber

  slack_notify:
    needs: [github-release, build]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    if: ${{ always() }}
    permissions:
      actions: read
    env:
      # step の if では secrets コンテキストを使えないため、job の env で受け渡す
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
    steps:
      - name: Slack Notification
        # fork からの PR など secrets.SLACK_WEBHOOK が空の実行で通知 job を失敗させない
        if: ${{ env.SLACK_WEBHOOK != '' }}
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ env.SLACK_WEBHOOK }}
          slack_channel: zakuro
          notify_mode: failure_and_fixed
