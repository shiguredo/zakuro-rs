name: ci

on:
  push:
    paths:
      - "src/**"
      - "resource/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - ".github/workflows/ci.yml"
  schedule:
    # JST 11:00 (UTC 02:00), 月-金
    - cron: "0 2 * * 1-5"

jobs:
  ci:
    name: CI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-26.04
          # - ubuntu-24.04-arm
          # - ubuntu-26.04-arm
          # - macos-26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # libduckdb-sys に prebuilt バイナリをダウンロードさせる (bundled ビルドは CI で 30 分以上かかるため)
      DUCKDB_DOWNLOAD_LIB: "1"
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable
      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse-dev libx11-dev
      - run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Verify Cargo metadata
        run: |
          DESCRIPTION=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[] | select(.name == "zakuro") | .description')
          if [ "$DESCRIPTION" != "Recording Composition Tool Zakuro" ]; then
            echo "::error::Cargo.toml description mismatch: $DESCRIPTION"
            exit 1
          fi

  slack_notify:
    needs: [ci]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    if: ${{ always() }}
    permissions:
      actions: read
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: zakuro
          notify_mode: failure_and_fixed
