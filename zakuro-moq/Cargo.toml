[package]
name = "zakuro-moq"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "MOQ (Media over QUIC Transport) load testing tool Zakuro"
readme = "../README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "zakuro-moq"
path = "src/main.rs"

[dependencies]
# CA 証明書を ngtcp2 に 1 枚ずつ渡すための PEM エンコード
base64ct = { version = "1.8", features = ["alloc"] }
# ログのファサード (共有クレート zakuro-core も使う)
log = "0.4"
# CLI 引数パース
noargs = "0.4"
# JSON パース / 生成
nojson = "0.3"
# TLS (s2n-quic の rustls provider、WebTransport over HTTP/2 と QMux の TLS over TCP で利用)
rustls = "0.23"
# HTTP/2 と WebTransport over HTTP/2 の Sans I/O 実装
shiguredo_http2 = "2026.1.0-canary.16"
# HTTP/3 と WebTransport の Sans I/O 実装
shiguredo_http3 = "2026.1.0-canary.12"
# ngtcp2 による QUIC 接続 (RESET_STREAM_AT 対応の Tokio 統合)
shiguredo_ngtcp2_tokio = "2026.1.0-canary.2"
# TLS ハンドシェイクの Tokio 統合 (QMux 経路の TLS over TCP で利用)
tokio-rustls = "0.26"
# tokio Stream ラッパー (ReceiverStream)
tokio-stream = "0.1"
# tokio ユーティリティ (CancellationToken, DelayQueue)
tokio-util = { version = "0.7", features = ["time"] }
# ログ出力 (log ファサードの記録も tracing-log 経由で取り込む)
tracing = "0.1"
tracing-log = "0.2"
# ログのフォーマット / レベル制御
tracing-subscriber = "0.3"
# WebPKI のルート証明書 (MOQ relay へ接続する際の既定の信頼ストア)
webpki-roots = "1"
# 負荷試験ツール共通の基盤 (統計 / HTTP サーバー / JSON-RPC)
zakuro-core = { path = "../zakuro-core" }

# 複数キーを持つ依存はインラインテーブルではなくテーブルセクションで記述する。
# tombi は行長超過のインラインテーブルを複数行に展開するが、複数行インラインテーブルは
# TOML 1.1 の機能であり cargo がマニフェストを解析できない場合がある。

# QUIC クライアント。datagram endpoint を有効にして max_datagram_frame_size を広告する:
# MOQT は object を datagram でも運ぶため (draft-ietf-moq-transport-22)
[dependencies.s2n-quic]
version = "1.88"
default-features = false
features = [
  "provider-address-token-default",
  "provider-tls-rustls",
  "unstable-provider-datagram",
]

# Media over QUIC Transport (MOQT) の Sans I/O プロトコル実装。
# crates.io には未公開のため git 依存とし、再現性のため rev を固定する
[dependencies.shiguredo_moqt]
git = "https://github.com/shiguredo/moqt-rs"
rev = "49c711e5832272a7dbde3f8953a6dd62815f7ad6"

# QMux (draft-ietf-quic-qmux-02) の Sans I/O 実装。
# crates.io には未公開のため git 依存とし、再現性のため rev を固定する。
# rev は moqt-rs の examples/tokio-moq が固定している値と揃える
[dependencies.shiguredo_qmux]
git = "https://github.com/shiguredo/qmux-rs"
rev = "3e0dc0f6a7404b940a67a42e04f986a79811a046"

# 非同期ランタイム
[dependencies.tokio]
version = "1.53"
features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
]

# QMux の Tokio ラッパー。tokio-qmux は publish = false のため git 依存で固定する
[dependencies.tokio-qmux]
git = "https://github.com/shiguredo/qmux-rs"
rev = "3e0dc0f6a7404b940a67a42e04f986a79811a046"

[dev-dependencies]
# QUIC 接続テスト用の自己署名証明書生成
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
# QUIC 接続テスト用の証明書ファイルを保持する
tempfile = "3.27"
